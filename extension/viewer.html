<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; font: 13px system-ui, sans-serif; background: Canvas; color: CanvasText; }
      header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid color-mix(in srgb, CanvasText 20%, transparent); position: sticky; top: 0; background: Canvas; }
      h1 { font-size: 14px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid color-mix(in srgb, CanvasText 30%, transparent); background: Canvas; color: CanvasText; cursor: pointer; }
      main { padding: 16px; }
      img { max-width: 100%; height: auto; display: block; margin: 0 auto; box-shadow: 0 2px 12px rgba(0,0,0,.25); }
      img.actual { max-width: none; }
      .meta { color: GrayText; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="name">Screenshot</h1>
      <span class="meta" id="meta"></span>
      <button id="zoom" type="button">Actual size</button>
      <button id="save" type="button">Save</button>
    </header>
    <main><img id="img" alt="Screenshot" /></main>
    <script src="viewer.js"></script>
  </body>
</html>
